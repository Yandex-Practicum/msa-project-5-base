apiVersion: v1
kind: Pod
metadata:
  name: verify-output
  namespace: analytics-export
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "ls -l /data && echo '--- CSV ---' && cat /data/*.csv"]
      volumeMounts:
        - name: output
          mountPath: /data
  volumes:
    - name: output
      persistentVolumeClaim:
        claimName: export-output
